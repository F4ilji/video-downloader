services:
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    volumes:
      - ./downloads:/downloads
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./downloads:/downloads
      - ./cookies.txt:/cookies.txt:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      xray:
        condition: service_started
      pot-provider:
        condition: service_started
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  worker:
    build: .
    command: celery -A src.tasks.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./downloads:/downloads
      - ./cookies.txt:/cookies.txt:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      xray:
        condition: service_started
      pot-provider:
        condition: service_started
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped

  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    ports:
      - "4416:4416"
    restart: unless-stopped

  cookie-provider:
    build:
      context: .
      dockerfile: Dockerfile.cookie-provider
    volumes:
      - cookie-data:/data
      - ./cookies.txt:/data/cookies.txt
    ports:
      - "8080:8080"
    restart: unless-stopped
    profiles:
      - login

  xray:
    image: teddysun/xray:1.8.24
    volumes:
      - ./xray/config.json:/etc/xray/config.json:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-video_downloader}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  cookie-data:
