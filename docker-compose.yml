services:
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    volumes:
      - ./downloads:/downloads
    depends_on:
      - api

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./downloads:/downloads
      - ./cookies.txt:/cookies.txt:ro
    depends_on:
      - redis
      - postgres
      - xray
      - pot-provider
    environment:
      - APP_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/video_downloader
      - APP_REDIS_URL=redis://redis:6379/0
      - APP_DOWNLOADS_PATH=/downloads
      - APP_PROXY=socks5://xray:10808
      - APP_YT_CLIENT=mweb
      - APP_YT_DLP_COOKIES_PATH=/cookies.txt
    dns:
      - 8.8.8.8
      - 8.8.4.4

  worker:
    build: .
    command: celery -A src.tasks.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./downloads:/downloads
      - ./cookies.txt:/cookies.txt:ro
    depends_on:
      - redis
      - postgres
      - xray
      - pot-provider
    environment:
      - APP_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/video_downloader
      - APP_REDIS_URL=redis://redis:6379/0
      - APP_DOWNLOADS_PATH=/downloads
      - APP_PROXY=socks5://xray:10808
      - APP_YT_CLIENT=mweb
      - APP_YT_DLP_COOKIES_PATH=/cookies.txt
    dns:
      - 8.8.8.8
      - 8.8.4.4

  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    ports:
      - "4416:4416"
    restart: unless-stopped

  cookie-provider:
    build:
      context: .
      dockerfile: Dockerfile.cookie-provider
    volumes:
      - cookie-data:/data
      - ./cookies.txt:/data/cookies.txt
    ports:
      - "8080:8080"
    restart: unless-stopped
    profiles:
      - login

  xray:
    image: teddysun/xray:1.8.24
    volumes:
      - ./xray/config.json:/etc/xray/config.json:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: video_downloader
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  cookie-data:
