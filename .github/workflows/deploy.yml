name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build and deploy
        run: |
          export DOCKER_BUILDKIT=1
          docker compose build --parallel api worker frontend
          docker compose up -d --force-recreate api worker frontend
