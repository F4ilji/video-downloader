name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Deploy
        run: |
          cd /opt/video-downloader
          git fetch origin
          git reset --hard origin/main
          docker compose build api worker frontend
          docker compose up -d --force-recreate api worker frontend
